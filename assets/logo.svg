<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(10, 10)">
    <!-- Soft Glow -->
    <circle cx="45" cy="45" r="36" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />
    
    <!-- Outer Shield -->
    <path d="M 45 14 L 76 26 C 76 56 61 79 45 88 C 29 79 14 56 14 26 Z" fill="url(#shieldGrad)" />
    
    <!-- Inner Dark Shield -->
    <path d="M 45 19 L 71 29 C 71 54 58 74 45 81 C 32 74 19 54 19 29 Z" fill="#090d16" />
    
    <!-- Circuit Pulse Line -->
    <path d="M 31 50 L 39 50 L 42 42 L 47 59 L 50 50 L 59 50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="45" cy="33" r="2.5" fill="#a855f7" />
    <circle cx="45" cy="68" r="2.5" fill="#10b981" />
  </g>

  <!-- Typography -->
  <!-- Title -->
  <text x="112" y="55" fill="#ffffff" font-size="36" font-weight="700" letter-spacing="-0.5">LongGuard</text>

  <!-- Tagline -->
  <text x="114" y="80" fill="#94a3b8" font-size="14" font-weight="500" letter-spacing="0.1">Chain-of-Thought Circuit Breaker for AI Agents</text>
</svg>
