<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Icon Background Glow -->
  <circle cx="85" cy="90" r="50" fill="#6366f1" opacity="0.18" filter="url(#glow)" />

  <!-- Shield Outer -->
  <path d="M 85 42 L 125 58 C 125 95 105 125 85 138 C 65 125 45 95 45 58 Z" fill="url(#shieldGrad)" />

  <!-- Shield Inner Dark Accent -->
  <path d="M 85 48 L 119 62 C 119 93 102 119 85 130 C 68 119 51 93 51 62 Z" fill="#0f172a" />

  <!-- Circuit / Loop Breaker Pulse inside shield -->
  <path d="M 68 88 L 78 88 L 82 78 L 88 100 L 92 88 L 102 88" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="85" cy="65" r="3" fill="#a855f7" />
  <circle cx="85" cy="112" r="3" fill="#10b981" />

  <!-- Title & Subtitle -->
  <text x="160" y="86" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">LongGuard</text>
  
  <!-- Version & Safety Badge -->
  <rect x="420" y="54" width="76" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="458" y="70" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">v0.1.1</text>

  <text x="162" y="115" fill="#94a3b8" font-size="15" font-weight="500">Chain-of-Thought Circuit Breaker for AI Agents</text>
  <text x="162" y="136" fill="#64748b" font-size="12" font-weight="600" letter-spacing="0.5">PART OF THE ENDEVSOLS LONG SUITE</text>
</svg>
