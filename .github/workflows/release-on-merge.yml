name: Release merged PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to release or retry
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

# Keep independent merges from cancelling each other's release runs.
concurrency:
  group: release-merge-${{ github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Find merged PR
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let number;
            if (context.eventName === 'workflow_dispatch') {
              const input = context.payload.inputs.pr_number;
              if (!/^[1-9]\d*$/.test(input)) {
                throw new Error('Enter a positive merged PR number');
              }
              number = Number(input);
            } else {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: context.sha, per_page: 100 }
              );
              const match = associated.find(pr =>
                pr.merged_at && pr.merge_commit_sha === context.sha &&
                pr.base.ref === 'main' &&
                pr.base.repo.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase()
              );
              if (!match) {
                core.info('No PR merged into main at this commit; skipping release.');
                return;
              }
              number = match.number;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (!pr.merged || !pr.merge_commit_sha || pr.base.ref !== 'main' ||
                pr.base.repo.full_name.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              throw new Error('Only PRs merged into this repository main branch can release');
            }

            // Check if the PR has a 'release' label for stable release
            const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : (l.name || '')).toLowerCase());
            const isStable = labels.includes('release');
            core.setOutput('stable', isStable ? 'true' : 'false');
            core.info(`Release mode: ${isStable ? 'STABLE' : 'dev'}`);

            require('fs').writeFileSync(
              `${process.env.RUNNER_TEMP}/release-pr.json`, JSON.stringify({ pull_request: pr })
            );
            core.setOutput('sha', pr.merge_commit_sha);
      # A push to main is trusted repository code, including merges from forks.
      - uses: actions/checkout@v6
        if: steps.pr.outputs.sha != ''
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: steps.pr.outputs.sha != ''
        with:
          python-version: '3.12'
      - name: Prepare versioned release source
        id: prepare
        if: steps.pr.outputs.sha != ''
        env:
          RELEASE_STABLE: ${{ steps.pr.outputs.stable }}
        run: GITHUB_EVENT_PATH="$RUNNER_TEMP/release-pr.json" python scripts/prepare_merge_release.py
      - name: Push release tag
        if: steps.pr.outputs.sha != ''
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      publish: true
