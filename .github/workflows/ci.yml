name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checks:
    name: Code Quality, Typing, Docs & Package Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Run Ruff Linter & Formatter
        run: |
          uv run --python 3.11 ruff check src/ tests/ scripts/

      - name: Run MyPy Type Checker
        run: uv run --python 3.11 mypy src/

      - name: Check Version Consistency
        run: uv run --python 3.11 python scripts/check_version.py

      - name: Strict Documentation Build Check
        run: uv run --python 3.11 mkdocs build --strict

      - name: Verify Package Build
        run: uv build

      - name: Validate Built Distribution and Metadata
        run: |
          uv run --python 3.11 twine check --strict dist/*
          uv run --python 3.11 python scripts/check_version.py --check-dist

  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: [checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run Pytest Suite with Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest tests/ --cov=longguard --cov-report=xml --cov-report=term-missing

      - name: Run Pytest Suite
        if: "!(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12')"
        run: uv run --python ${{ matrix.python-version }} pytest tests/

  frameworks:
    name: Real frameworks (locked)
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Install framework contracts
        run: uv sync --locked --python 3.12 --extra dev --extra langgraph --extra langchain --extra crewai
      - name: Require framework presence
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version; print({n: version(n) for n in ('langgraph', 'langchain', 'crewai')})"
      - name: Execute gates and require real framework tests
        run: uv run --no-sync python scripts/verify_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-locked
          path: |
            release-evidence.json
            release-coverage.json
      - name: Reproduce provisional benchmark
        run: uv run --no-sync python tests/benchmarks/run.py --output /tmp/benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-locked
          path: /tmp/benchmark.json
