name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run Ruff Linter & Formatter
        run: |
          uv run --python ${{ matrix.python-version }} ruff check src/ tests/ scripts/

      - name: Check Version Consistency
        run: |
          uv run --python ${{ matrix.python-version }} python scripts/check_version.py

      - name: Strict Documentation Build Check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run --python ${{ matrix.python-version }} mkdocs build --strict

      - name: Run MyPy Type Checker
        run: |
          uv run --python ${{ matrix.python-version }} mypy src/

      - name: Run Pytest Suite with Coverage
        run: |
          uv run --python ${{ matrix.python-version }} pytest tests/ --cov=longguard --cov-report=xml --cov-report=term-missing

      - name: Verify Package Build
        run: |
          uv build

      - name: Validate Built Distribution and Metadata
        run: |
          uv run --python ${{ matrix.python-version }} twine check --strict dist/*
          uv run --python ${{ matrix.python-version }} python scripts/check_version.py --check-dist

  frameworks:
    name: Real frameworks (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, newest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Install framework contracts
        run: uv sync --locked --python 3.12 --extra dev --extra langgraph --extra langchain --extra crewai
      - name: Exercise newest compatible frameworks without changing the lockfile
        if: matrix.dependencies == 'newest'
        run: uv pip install --upgrade 'langgraph>=1.0.0' 'langchain>=1.0.0' 'crewai>=0.28.0,<1.15.36'
      - name: Require framework presence
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version; print({n: version(n) for n in ('langgraph', 'langchain', 'crewai')})"
      - name: Execute gates and require real framework tests
        run: uv run --no-sync python scripts/verify_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.dependencies }}
          path: |
            release-evidence.json
            release-coverage.json
      - name: Reproduce provisional benchmark
        run: uv run --no-sync python tests/benchmarks/run.py --output /tmp/benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.dependencies }}
          path: /tmp/benchmark.json
