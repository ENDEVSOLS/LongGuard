name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Test Suite
        run: uv run pytest tests/ -v

      - name: Build sdist and wheel
        run: uv build

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: release_body
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"

          # Extract changelog section for this version from CHANGELOG.md
          python3 - <<PY_EOF > changelog_section.md
          import re, sys
          version = "${VERSION}".strip()
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  text = f.read()
              pattern = rf"## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n## |\Z)"
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  notes = re.sub(r"\n---\s*$", "", notes).strip()
                  print(notes)
              else:
                  print("*No specific changelog entry found in CHANGELOG.md.*")
          except Exception as e:
              print(f"*Changelog extraction skipped: {e}*")
          PY_EOF

          cat <<BODY > release_body.md
          ## 🚀 What's Changed in ${TAG}

          $(cat changelog_section.md)

          ---

          ## 📦 Install / Upgrade

          ```bash
          pip install --upgrade longguard
          # or
          uv add longguard
          ```

          ## 🔗 Resources

          | | Link |
          |---|---|
          | 📖 Documentation | https://endevsols.github.io/LongGuard/ |
          | 🐍 PyPI | https://pypi.org/project/longguard/ |
          | 🌐 EnDevSols Long Suite | https://endevsols.com/open-source |
          | 🐛 Report a Bug | https://github.com/ENDEVSOLS/LongGuard/issues |
          | 📜 Full Changelog | https://github.com/ENDEVSOLS/LongGuard/blob/main/CHANGELOG.md |

          ## ✅ Quality

          - All tests passing (ruff + mypy strict + pytest)
          - Supported: Python 3.10, 3.11, 3.12 · Ubuntu & macOS

          ---

          *Part of the [EnDevSols Long Suite](https://endevsols.com/open-source) — production AI tooling for Python.*
          BODY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: LongGuard ${{ steps.version.outputs.TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: false
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
