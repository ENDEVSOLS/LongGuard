name: Feature Request
description: Propose a new feature, adapter, detector, or enhancement for LongGuard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make LongGuard better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe what you would like to happen and provide sample API usage if applicable.
      placeholder: |
        ```python
        # Proposed API usage:
        ...
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or framework documentation links here.
    validations:
      required: false

