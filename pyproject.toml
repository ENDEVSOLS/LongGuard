[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longguard"
version = "0.3.0"
description = "Circuit breaker middleware for LangGraph/LangChain agents — detect loops, inject Reflect & Pivot, prevent runaway costs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "langchain",
    "langgraph",
    "crewai",
    "agents",
    "ai-agents",
    "circuit-breaker",
    "ai-safety",
    "agentic-ai",
    "guardrails",
    "cost-control",
    "cost-optimization",
    "loop-detection",
    "openai",
    "anthropic",
    "observability",
]
authors = [
    { name = "EnDevSols", email = "technology@endevsols.com" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ENDEVSOLS/LongGuard"
Repository = "https://github.com/ENDEVSOLS/LongGuard"
Documentation = "https://endevsols.github.io/LongGuard/"
Changelog = "https://github.com/ENDEVSOLS/LongGuard/blob/main/CHANGELOG.md"
Issues = "https://github.com/ENDEVSOLS/LongGuard/issues"
Discussions = "https://github.com/ENDEVSOLS/LongGuard/discussions"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
]
langchain = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
]
crewai = [
    "crewai>=1.15.19,<1.15.29",
]
embeddings = [
    "sentence-transformers>=2.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
]
all = [
    "longguard[langgraph,langchain,crewai,embeddings,docs]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0,<2.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longguard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP038"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "langchain_core",
    "langchain_core.*",
    "langchain",
    "langchain.*",
    "langgraph",
    "langgraph.*",
    "crewai",
    "crewai.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring optional dependencies",
]

[tool.coverage.report]
precision = 2
