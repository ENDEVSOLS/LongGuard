[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longguard"
version = "0.1.3"
description = "Circuit breaker middleware for LangGraph/LangChain agents — detect loops, inject Reflect & Pivot, prevent runaway costs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["langchain", "langgraph", "agents", "circuit-breaker", "llm", "cost-control", "loop-detection"]
authors = [
    { name = "EnDevSols", email = "technology@endevsols.com" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ENDEVSOLS/LongGuard"
Repository = "https://github.com/ENDEVSOLS/LongGuard"
Issues = "https://github.com/ENDEVSOLS/LongGuard/issues"
Documentation = "https://github.com/ENDEVSOLS/LongGuard#readme"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
]
langchain = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
]
embeddings = [
    "sentence-transformers>=2.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
]
all = [
    "longguard[langgraph,langchain,embeddings,docs]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0,<2.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longguard"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "langchain_core",
    "langchain_core.*",
    "langchain",
    "langchain.*",
    "langgraph",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring optional dependencies",
]
